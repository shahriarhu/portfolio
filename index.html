<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/portfolio/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Portfolio of Md Shahriar Hossain">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="portfolio_shu">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>portfolio_shu</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
<!-- Custom Loading Screen -->
<div id="loading" class="loader">
  <div class="spinner"></div>
  <p>Loading portfolio...</p>
</div>

<!-- Flutter App Bootstrap -->
<script src="flutter_bootstrap.js" async></script>

<!-- Hide loader once Flutter is ready -->
<script>
  window.addEventListener('load', function () {
    const loader = document.getElementById('loading');
    if (loader) loader.style.display = 'none';
  });
</script>
</body>

<style>
  body {
    margin: 0;
    background-color: #121212;
    font-family: 'Segoe UI', sans-serif;
    color: white;
  }

  .loader {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: #121212;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    z-index: 9999;
  }

  .spinner {
    width: 60px;
    height: 60px;
    border: 6px solid #2e2e2e;
    border-top: 6px solid #00c4b4;
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin-bottom: 20px;
  }

  .loader p {
    font-size: 16px;
    opacity: 0.7;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }
</style>
</html>
