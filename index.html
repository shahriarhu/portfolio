<!DOCTYPE html>
<html>
<head>
  <base href="/portfolio/">

  <meta charset="UTF-8" />
  <meta content="IE=Edge" http-equiv="X-UA-Compatible" />
  <meta name="description" content="Portfolio of Md Shahriar Hossain" />

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="portfolio_basic_shu" />
  <link rel="apple-touch-icon" href="icons/Icon-192.png" />

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <!-- Material Icons (needed for Flutter Icon widgets) -->
  <link href="https://fonts.googleapis.com/css?family=Material+Icons" rel="stylesheet">

  <title>portfolio_basic_shu</title>
  <link rel="manifest" href="manifest.json" />

  <style>
    /* Fullscreen dark background with centered spinner */
    #loading {
      position: fixed;
      inset: 0;
      background-color: #121212; /* Dark theme background */
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    /* White spinner with subtle transparency */
    .spinner {
      width: 50px;
      height: 50px;
      border: 5px solid rgba(255, 255, 255, 0.15);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>
<body>
<div id="loading">
  <div class="spinner"></div>
</div>

<script src="flutter_bootstrap.js" async></script>

<script>
  window.addEventListener('flutter-first-frame', () => {
    const loading = document.getElementById('loading');
    if (loading) loading.style.display = 'none';
  });
</script>
</body>
</html>
